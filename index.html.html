<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5a8a8">
<title>ひだまりログ v0.1</title>
<style>
:root{
  --bg:#fffaf6;--card:#fff;--ink:#4b3b3b;--muted:#9b8585;--line:#f1dddd;
  --pink:#f3a6a6;--pink2:#ffd9d5;--pink3:#fff0ed;--accent:#d97979;--shadow:0 8px 24px rgba(116,71,71,.08);
}
html[data-theme="dark"]{
  --bg:#2b2323;--card:#382d2d;--ink:#f7eaea;--muted:#c7abab;--line:#574242;
  --pink:#d98e94;--pink2:#69474b;--pink3:#453536;--accent:#f0a3a8;--shadow:0 8px 24px rgba(0,0,0,.22);
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.headrow{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.brand small{font-size:11px;color:var(--muted);font-weight:600}
.iconbtn{border:0;background:var(--pink3);color:var(--ink);width:38px;height:38px;border-radius:12px}
main{padding:14px}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px}.datebar button{border:0;background:var(--pink3);border-radius:12px;padding:9px 13px;color:var(--ink)}
.date{font-weight:800;text-align:center}.date small{display:block;color:var(--muted);font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 6px;border-radius:999px;font-weight:700}.tab.active{background:var(--pink);color:#fff;border-color:var(--pink)}
textarea,input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;outline:none}
textarea{min-height:92px;resize:vertical}.composer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.primary{border:0;background:var(--pink);color:white;border-radius:12px;padding:10px 18px;font-weight:800}
.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px}
.stamps{display:flex;gap:7px;flex-wrap:wrap}.stamp{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 10px}.stamp.on{background:var(--pink2);border-color:var(--pink)}
.entry{padding:12px 2px;border-bottom:1px dashed var(--line)}.entry:last-child{border:0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:5px}.entrytext{white-space:pre-wrap;line-height:1.6}.star{border:0;background:none;color:var(--muted);font-size:18px}.star.on{color:#e8a126}.empty{text-align:center;color:var(--muted);padding:24px 8px}
.section-title{font-weight:800;margin:4px 0 10px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:auto;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav{border:0;background:none;color:var(--muted);padding:7px 2px;font-size:12px}.nav b{display:block;font-size:19px;margin-bottom:2px}.nav.active{color:var(--accent);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.char{padding:13px;border:1px solid var(--line);background:var(--card);border-radius:16px;text-align:left;color:var(--ink)}.char strong{display:block}.char small{color:var(--muted)}
.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}
.charhead{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:none;color:var(--accent);font-weight:800;padding:0}
.search{margin-bottom:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{min-height:66px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px;color:var(--ink);font-size:12px}.calday.muted{opacity:.35}.dots{font-size:10px;line-height:1.2;margin-top:5px;color:var(--accent)}
.quote{background:var(--pink3);border-radius:14px;padding:12px;line-height:1.6}
.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:92px;border:0;background:var(--accent);color:white;width:54px;height:54px;border-radius:50%;font-size:25px;box-shadow:var(--shadow)}
@media(max-width:480px){.grid{grid-template-columns:1fr}.app{width:100%}}
</style>
</head>
<body>
<div class="app">
<header><div class="headrow"><div class="brand">ひだまりログ <small>v0.1</small></div><button class="iconbtn" id="themeBtn" title="テーマ切替">☾</button></div></header>
<main>
<section class="page active" id="diaryPage">
  <div class="card datebar"><button id="prevDay">←</button><div class="date" id="dateLabel"></div><button id="nextDay">→</button></div>
  <div class="tabs" id="diaryTabs">
    <button class="tab" data-tab="happy">うれしい</button><button class="tab active" data-tab="daily">日常</button><button class="tab" data-tab="weak">弱音</button>
  </div>
  <div class="card">
    <textarea id="diaryInput" placeholder="今のことを、ひとこと。"></textarea>
    <div class="composer-actions"><small id="diaryHint">日常のつぶやき</small><button class="primary" id="postDiary">記録する</button></div>
  </div>
  <div class="card"><div class="section-title">今日のスタンプ</div><div class="stamps" id="stampList"></div></div>
  <div class="card"><div class="section-title" id="entriesTitle">日常</div><div id="diaryEntries"></div></div>
  <div class="card" id="memoryCard"><div class="section-title">過去のうれしかったこと</div><div class="quote" id="happyMemory">まだ「うれしい」の記録がありません。</div></div>
</section>

<section class="page" id="charactersPage">
  <input class="search" id="charSearch" placeholder="キャラクターを検索">
  <div class="card">
    <div class="section-title">キャラクター</div><div class="grid" id="charGrid"></div>
  </div>
  <div class="card">
    <div class="section-title">新しいキャラクター</div>
    <input id="charName" placeholder="名前">
    <div class="row" style="margin-top:8px"><select id="charKind"><option value="oc">OC</option><option value="copyright">版権</option></select><select id="ocKind"><option value="investigator">探索者</option><option value="original">一次創作</option></select></div>
    <input id="workName" placeholder="作品名 / システム名（任意）" style="margin-top:8px">
    <button class="primary" id="addChar" style="margin-top:9px">登録</button>
  </div>
</section>

<section class="page" id="charDetailPage">
  <div class="card">
    <div class="charhead"><button class="back" id="charBack">← キャラ一覧</button><button class="ghost" id="deleteChar">削除</button></div>
    <h2 id="charTitle"></h2><div id="charSub" style="color:var(--muted)"></div>
  </div>
  <div class="tabs" id="charTabs"><button class="tab active" data-ctab="quotes">台詞</button><button class="tab" data-ctab="settings">設定</button><button class="tab" data-ctab="thoughts">つぶやき</button></div>
  <div class="card"><textarea id="charInput"></textarea><div class="composer-actions"><small id="charHint"></small><button class="primary" id="postChar">追加</button></div></div>
  <div class="card"><div id="charEntries"></div></div>
</section>

<section class="page" id="calendarPage">
  <div class="card"><div class="datebar"><button id="prevMonth">←</button><div class="date" id="monthLabel"></div><button id="nextMonth">→</button></div></div>
  <div class="card"><div class="calgrid" id="calendarGrid"></div></div>
</section>

<section class="page" id="searchPage">
  <input class="search" id="globalSearch" placeholder="日記・キャラメモを全文検索">
  <div class="card"><div class="section-title">検索結果</div><div id="searchResults" class="empty">キーワードを入力してください。</div></div>
</section>
</main>
<nav class="bottom">
<button class="nav active" data-page="diaryPage"><b>⌂</b>日記</button>
<button class="nav" data-page="charactersPage"><b>♡</b>キャラ</button>
<button class="nav" data-page="calendarPage"><b>□</b>カレンダー</button>
<button class="nav" data-page="searchPage"><b>⌕</b>検索</button>
</nav>
</div>
<script>
const KEY='hidamari_log_v01';
const defaultData={diary:[],stamps:{},characters:[],theme:'light'};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData;
let currentDate=new Date(), diaryTab='daily', currentChar=null, charTab='quotes', calDate=new Date();
const stamps=['生理','頭痛','腹痛','眠い','メンタル↓','元気','運動'];
const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));};
const ds=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const esc=s=>(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function applyTheme(){document.documentElement.dataset.theme=data.theme||'light';document.getElementById('themeBtn').textContent=data.theme==='dark'?'☀':'☾';}
themeBtn.onclick=()=>{data.theme=data.theme==='dark'?'light':'dark';save();applyTheme()};applyTheme();

function renderDiary(){
 const key=ds(currentDate), names={happy:'うれしい',daily:'日常',weak:'弱音'}, hints={happy:'うれしかったことを残そう',daily:'日常のつぶやき',weak:'ここでは遠慮なく弱音を吐いていい'};
 dateLabel.innerHTML=`${currentDate.getMonth()+1}月${currentDate.getDate()}日<small>${['日','月','火','水','木','金','土'][currentDate.getDay()]}曜日</small>`;
 entriesTitle.textContent=names[diaryTab];diaryHint.textContent=hints[diaryTab];
 diaryInput.placeholder=diaryTab==='happy'?'今日うれしかったことは？':diaryTab==='weak'?'しんどいこと、ここに置いていこ。':'今のことを、ひとこと。';
 document.querySelectorAll('#diaryTabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===diaryTab));
 const list=data.diary.filter(e=>e.date===key&&e.type===diaryTab).sort((a,b)=>b.ts-a.ts);
 diaryEntries.innerHTML=list.length?list.map(e=>`<div class="entry"><div class="meta"><span>${new Date(e.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</span><span><button class="star ${e.fav?'on':''}" onclick="toggleDiaryFav('${e.id}')">★</button><button class="star" onclick="delDiary('${e.id}')">×</button></span></div><div class="entrytext">${esc(e.text)}</div></div>`).join(''):'<div class="empty">まだ記録がありません。</div>';
 stampList.innerHTML=stamps.map(s=>`<button class="stamp ${(data.stamps[key]||[]).includes(s)?'on':''}" onclick="toggleStamp('${s}')">${s}</button>`).join('');
 const happy=data.diary.filter(e=>e.type==='happy'&&e.date!==key);
 happyMemory.textContent=happy.length?happy[Math.floor(Math.random()*happy.length)].text:'まだ「うれしい」の記録がありません。';
}
prevDay.onclick=()=>{currentDate.setDate(currentDate.getDate()-1);renderDiary()};nextDay.onclick=()=>{currentDate.setDate(currentDate.getDate()+1);renderDiary()};
document.querySelectorAll('#diaryTabs .tab').forEach(b=>b.onclick=()=>{diaryTab=b.dataset.tab;renderDiary()});
postDiary.onclick=()=>{let t=diaryInput.value.trim();if(!t)return;data.diary.push({id:crypto.randomUUID(),date:ds(currentDate),type:diaryTab,text:t,ts:Date.now(),fav:false});diaryInput.value='';save();renderDiary();};
window.toggleStamp=s=>{let k=ds(currentDate),a=data.stamps[k]||[];data.stamps[k]=a.includes(s)?a.filter(x=>x!==s):[...a,s];save();renderDiary();};
window.toggleDiaryFav=id=>{let e=data.diary.find(x=>x.id===id);if(e)e.fav=!e.fav;save();renderDiary();};
window.delDiary=id=>{if(confirm('この記録を削除しますか？')){data.diary=data.diary.filter(x=>x.id!==id);save();renderDiary();}};

function renderChars(){
 let q=charSearch.value.trim().toLowerCase();let arr=data.characters.filter(c=>(c.name+' '+(c.work||'')).toLowerCase().includes(q));
 charGrid.innerHTML=arr.length?arr.map(c=>`<button class="char" onclick="openChar('${c.id}')"><strong>${esc(c.name)}</strong><small>${c.kind==='oc'?(c.ocKind==='investigator'?'OC・探索者':'OC・一次創作'):'版権'}${c.work?' / '+esc(c.work):''}</small></button>`).join(''):'<div class="empty">まだキャラクターがいません。</div>';
}
charSearch.oninput=renderChars;
charKind.onchange=()=>ocKind.classList.toggle('hidden',charKind.value!=='oc');
addChar.onclick=()=>{let name=charName.value.trim();if(!name)return;data.characters.push({id:crypto.randomUUID(),name,kind:charKind.value,ocKind:ocKind.value,work:workName.value.trim(),notes:{quotes:[],settings:[],thoughts:[]}});charName.value='';workName.value='';save();renderChars();};
window.openChar=id=>{currentChar=id;charTab='quotes';renderCharDetail();showPage('charDetailPage');};
charBack.onclick=()=>{renderChars();showPage('charactersPage')};
function renderCharDetail(){
 let c=data.characters.find(x=>x.id===currentChar);if(!c)return;
 charTitle.textContent=c.name;charSub.textContent=(c.kind==='oc'?(c.ocKind==='investigator'?'OC・探索者':'OC・一次創作'):'版権')+(c.work?' / '+c.work:'');
 document.querySelectorAll('#charTabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.ctab===charTab));
 let ph={quotes:'そのキャラの台詞を残す',settings:'設定・考察・プロフィールを書く',thoughts:'このキャラへのオタクの叫びをぶち込む'};
 charHint.textContent=ph[charTab];charInput.placeholder=ph[charTab]+'…';
 let arr=(c.notes[charTab]||[]).slice().sort((a,b)=>b.ts-a.ts);
 charEntries.innerHTML=arr.length?arr.map(e=>`<div class="entry"><div class="meta"><span>${new Date(e.ts).toLocaleString('ja-JP')}</span><span><button class="star ${e.fav?'on':''}" onclick="toggleCharFav('${e.id}')">★</button><button class="star" onclick="delCharNote('${e.id}')">×</button></span></div><div class="entrytext">${esc(e.text)}</div></div>`).join(''):'<div class="empty">まだメモがありません。</div>';
}
document.querySelectorAll('#charTabs .tab').forEach(b=>b.onclick=()=>{charTab=b.dataset.ctab;renderCharDetail()});
postChar.onclick=()=>{let t=charInput.value.trim(),c=data.characters.find(x=>x.id===currentChar);if(!t||!c)return;c.notes[charTab].push({id:crypto.randomUUID(),text:t,ts:Date.now(),fav:false});charInput.value='';save();renderCharDetail();};
window.toggleCharFav=id=>{let c=data.characters.find(x=>x.id===currentChar),e=c.notes[charTab].find(x=>x.id===id);if(e)e.fav=!e.fav;save();renderCharDetail()};
window.delCharNote=id=>{if(confirm('このメモを削除しますか？')){let c=data.characters.find(x=>x.id===currentChar);c.notes[charTab]=c.notes[charTab].filter(x=>x.id!==id);save();renderCharDetail();}};
deleteChar.onclick=()=>{if(confirm('このキャラクターとメモをすべて削除しますか？')){data.characters=data.characters.filter(x=>x.id!==currentChar);save();renderChars();showPage('charactersPage')}};

function renderCalendar(){
 let y=calDate.getFullYear(),m=calDate.getMonth();monthLabel.textContent=`${y}年 ${m+1}月`;
 let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
 let heads=['日','月','火','水','木','金','土'].map(x=>`<div style="text-align:center;color:var(--muted);font-size:12px">${x}</div>`).join('');
 let days='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=ds(d),cnt=data.diary.filter(e=>e.date===k).length,st=data.stamps[k]||[];days+=`<button class="calday ${d.getMonth()!==m?'muted':''}" onclick="jumpDay('${k}')"><b>${d.getDate()}</b><div class="dots">${cnt?`記録 ${cnt}`:''}${st.length?'<br>'+st.join('・'):''}</div></button>`}calendarGrid.innerHTML=heads+days;
}
prevMonth.onclick=()=>{calDate.setMonth(calDate.getMonth()-1);renderCalendar()};nextMonth.onclick=()=>{calDate.setMonth(calDate.getMonth()+1);renderCalendar()};
window.jumpDay=k=>{currentDate=new Date(k+'T12:00:00');renderDiary();showPage('diaryPage')};

globalSearch.oninput=()=>{
 let q=globalSearch.value.trim().toLowerCase();if(!q){searchResults.innerHTML='キーワードを入力してください。';searchResults.className='empty';return}
 let out=[];
 data.diary.filter(e=>e.text.toLowerCase().includes(q)).forEach(e=>out.push(`<div class="entry"><div class="meta"><span>日記 / ${e.date}</span></div><div class="entrytext">${esc(e.text)}</div></div>`));
 data.characters.forEach(c=>Object.entries(c.notes).forEach(([type,arr])=>arr.filter(e=>e.text.toLowerCase().includes(q)).forEach(e=>out.push(`<div class="entry"><div class="meta"><span>${esc(c.name)} / ${{quotes:'台詞',settings:'設定',thoughts:'つぶやき'}[type]}</span></div><div class="entrytext">${esc(e.text)}</div></div>`))));
 searchResults.className='';searchResults.innerHTML=out.length?out.join(''):'<div class="empty">見つかりませんでした。</div>';
};
renderDiary();renderChars();renderCalendar();
</script>
</body>
</html>
